# Runs frontend lint + tests and backend tests on every push to main and every PR targeting main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint:all
        working-directory: frontend

      - name: Run tests
        run: npm run test:run
        working-directory: frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw test
        working-directory: backend
