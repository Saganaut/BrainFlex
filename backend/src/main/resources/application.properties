spring.application.name=brainflex


spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Redis is used only for caching, pub/sub, and Spring Session — there are no
# Redis-backed @RedisHash repositories. Disabling the repository scanner stops
# Spring Data Redis from inspecting (and warning about) the MongoDB repositories
# at startup. Re-enable if a Redis repository is ever introduced.
spring.data.redis.repositories.enabled=false

# Spring Session keeps cookies valid for 14 days even when idle. Combined with
# the Redis-backed store (SessionConfig), sessions survive backend restarts.
spring.session.timeout=14d


# Disable strict check for MongoDB and Redis on startup
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

spring.docker.compose.enabled=false

logging.level.org.springframework.security=${LOGGING_LEVEL}

# Error-response disclosure hardening — keep all three at "never".
# GlobalExceptionHandler (@RestControllerAdvice) renders every error as an
# RFC 9457 ProblemDetail; these guard the fallback /error path so nothing leaks
# if an error escapes MVC dispatch. 4xx detail is set deliberately and safely by
# the handler; 5xx never carries ex.getMessage(), a stack trace, or raw binding
# errors. See z-docs/rules/EXCEPTION-RULES.md.
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# Observability (see z-docs/decisions/001-observability-stack.md). Expose only
# the read-only operational endpoints; `metrics` feeds Micrometer (and later
# micrometer-registry-cloudwatch2 in prod). Request logs gain traceId/userId via
# MdcLoggingFilter; the `prod` Spring profile switches Logback to JSON
# (logback-spring.xml) so stdout can be shipped to CloudWatch Logs.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

spring.mongodb.uri=${MONGO_URI}

# Now map the environment variables to the OAuth settings
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Discord OAuth2 (not OIDC — no id_token, attributes come from the /users/@me
# user-info endpoint). The ":unset" fallback keeps Spring's ClientRegistration
# builder happy when DISCORD_CLIENT_ID/SECRET aren't configured yet; the
# /oauth2/authorization/discord flow will simply fail at Discord with an
# "invalid client" until real credentials are dropped into dev.env.
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID:unset}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.discord.client-name=Discord
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/api/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id

# Microsoft OIDC via the /common endpoint (multi-tenant work + personal MSA).
# We configure the provider URIs manually instead of using issuer-uri because
# Microsoft's discovery document advertises an issuer with a {tenantid}
# placeholder, which Spring's strict issuer validation rejects.
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID:unset}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:unset}
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/common/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-name-attribute=sub

# S3 / Garage — credentials come from env vars (S3_ACCESS_KEY, S3_SECRET_KEY)
# Spring's relaxed binding maps them directly: S3_ACCESS_KEY -> s3.access-key -> S3Properties.accessKey

# Multipart upload limits
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
# Defer multipart parsing until the controller actually reads the file. Without
# this, Spring's StandardServletMultipartResolver parses the body during arg
# resolution and the request gets wrapped in a way that bypasses Spring
# Session's SessionRepositoryFilter — Spring Security then sees an empty
# SecurityContext on multipart POSTs and returns 401. Lazy resolution sidesteps
# the issue by waiting until @PreAuthorize has already evaluated.
spring.servlet.multipart.resolve-lazily=true


