<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1a1a1a; background: #f6f6f6; padding: 24px;">
  <div style="max-width: 520px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px;">
    <h1 style="font-size: 22px; margin: 0 0 16px;">Reset your BrainFlex password</h1>
    <p>
      We received a request to reset the password for your account. The link
      below is valid for one hour.
    </p>
    <p style="margin: 24px 0;">
      <a th:href="${resetUrl}"
         style="display: inline-block; padding: 12px 20px; background: #4f46e5; color: #fff; text-decoration: none; border-radius: 8px;">
        Reset password
      </a>
    </p>
    <p style="font-size: 12px; color: #666;">
      If you didn't request this, you can ignore this email — your password
      stays the same.
    </p>
  </div>
</body>
</html>
