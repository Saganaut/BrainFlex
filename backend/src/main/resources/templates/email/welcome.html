<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1a1a1a; background: #f6f6f6; padding: 24px;">
  <div style="max-width: 520px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px;">
    <h1 style="font-size: 22px; margin: 0 0 16px;">
      Welcome to BrainFlex, <span th:text="${displayName}">player</span>
    </h1>
    <p>
      Your account is live. You can build a deck, browse the public library, or
      jump into a quick game with one of the starter packs.
    </p>
    <p style="margin: 24px 0;">
      <a th:href="${frontendBaseUrl + '/decks'}"
         style="display: inline-block; padding: 12px 20px; background: #4f46e5; color: #fff; text-decoration: none; border-radius: 8px;">
        Open BrainFlex
      </a>
    </p>
    <p style="font-size: 12px; color: #666;">
      We sent this because you just signed up. If that wasn't you, just ignore
      this email and the account stays unused.
    </p>
  </div>
</body>
</html>
