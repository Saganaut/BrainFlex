# Provide test-safe values for all placeholders in application.properties.
# This is needed because the app normally loads these from a .env file at runtime,
# but that file is not present (and not used) during test execution.
# OAuth2 values are intentional dummies — tests use @WithMockUser, not real Google auth.
MONGO_URI=mongodb://root:secret@localhost:27017/brainflex_test?authSource=admin&serverSelectionTimeoutMS=2000
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_PASSWORD=password
GOOGLE_CLIENT_ID=test-client-id
GOOGLE_CLIENT_SECRET=test-client-secret
LOGGING_LEVEL=INFO
S3_ACCESS_KEY=test-access-key
S3_SECRET_KEY=test-secret-key
S3.access-key=test-access-key
S3.secret-key=test-secret-key
logging.level.org.springframework.security=INFO
# When HealthControllerTest mocks RedisConnectionFactory, the mock only implements
# the non-reactive interface. DataRedisReactiveAutoConfiguration then fails because
# it expects the same bean to also satisfy ReactiveRedisConnectionFactory (which the
# real LettuceConnectionFactory does, but a Mockito mock does not). Excluding the
# reactive auto-config is safe because no tests use reactive Redis.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
management.health.redis.enabled=false
