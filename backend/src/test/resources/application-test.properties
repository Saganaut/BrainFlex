# Direct Spring property overrides for the "test" profile.
# These take precedence over application.properties, so the ${...} placeholders
# there are never evaluated during test runs — no .env file is needed.
# OAuth2 values are intentional dummies; tests use @WithMockUser / oauth2Login(), not real Google auth.
spring.mongodb.uri=mongodb://root:secret@localhost:27017/brainflex_test?authSource=admin&serverSelectionTimeoutMS=2000
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=password
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
s3.access-key=test-access-key
s3.secret-key=test-secret-key

logging.level.org.springframework.security=INFO

# When HealthControllerTest mocks RedisConnectionFactory, the mock only implements
# the non-reactive interface. DataRedisReactiveAutoConfiguration then fails because
# it expects the same bean to also satisfy ReactiveRedisConnectionFactory (which the
# real LettuceConnectionFactory does, but a Mockito mock does not). Excluding the
# reactive auto-config is safe because no tests use reactive Redis.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
management.health.redis.enabled=false
